<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map model bake</title>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// Finds the triangles of the model that can be seen from outside it. Every
// triangle is drawn in its own colour (its number), from directions all
// round the tower, from 10 degrees below the horizon (a low camera looking up
// at the crown) to straight down: one direction in every cell of a grid (by
// default 1 degree of bearing by 5 of elevation), placed at random within its
// cell so the grid never lines up with the facades and keeps missing the same
// narrow slot. A triangle that never colours a pixel is hidden by others from
// everywhere the map's camera can be. Transparent and textured parts are kept
// whole and hide nothing.
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const params = new URLSearchParams(location.search)
const SIZE = Number(params.get('size') ?? 2048)                 // about 8 cm a pixel across the tower
const BEARING_STEP = Number(params.get('bearing') ?? 1)
const ELEVATION_STEP = Number(params.get('elevation') ?? 5)
const LOWEST = -10
// The same directions every run (mulberry32, fixed seed).
let seed = 0x41534344
const random = () => {
  seed = (seed + 0x6d2b79f5) | 0
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296
}

try {
  THREE.ColorManagement.enabled = false
  const renderer = new THREE.WebGLRenderer({ antialias: false })
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace
  renderer.setClearColor(0x000000, 1)
  const target = new THREE.WebGLRenderTarget(SIZE, SIZE, { samples: 0, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter })

  const gltf = await new GLTFLoader().loadAsync('/model.glb')
  gltf.scene.updateMatrixWorld(true)
  const scene = new THREE.Scene()
  const material = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })
  const parts = []
  let next = 1                          // 0 is the empty background
  gltf.scene.traverse(object => {
    if (!object.isMesh || object.geometry.userData.bake === undefined) return
    const source = object.geometry
    const count = (source.index ? source.index.count : source.attributes.position.count) / 3
    const keepAll = Boolean(object.material.transparent || object.material.map)
    parts.push({ id: source.userData.bake, triangles: count, offset: next, keepAll })
    if (!keepAll) {
      const geometry = new THREE.BufferGeometry()
      geometry.setAttribute('position', source.toNonIndexed().attributes.position)   // same triangle order
      const colors = new Uint8Array(count * 9)
      for (let t = 0; t < count; t++) {
        const id = next + t
        for (let v = 0; v < 3; v++) colors.set([id & 255, (id >> 8) & 255, (id >> 16) & 255], t * 9 + v * 3)
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3, true))
      const mesh = new THREE.Mesh(geometry, material)
      mesh.matrixAutoUpdate = false
      mesh.matrix.copy(object.matrixWorld)
      scene.add(mesh)
    }
    next += count
  })
  if (next >= 1 << 24) throw new Error('too many triangles to number in one colour')

  const sphere = new THREE.Box3().setFromObject(scene).getBoundingSphere(new THREE.Sphere())
  const r = sphere.radius * 1.02
  const camera = new THREE.OrthographicCamera(-r, r, r, -r, 0.1, r * 4)
  const directions = [[0, 90]]
  for (let elevation = LOWEST; elevation < 90; elevation += ELEVATION_STEP) {
    for (let bearing = 0; bearing < 360; bearing += BEARING_STEP) directions.push([bearing + random() * BEARING_STEP, Math.min(89.9, elevation + random() * ELEVATION_STEP)])
  }

  const pixels = new Uint8Array(SIZE * SIZE * 4)
  const words = new Uint32Array(pixels.buffer)   // one pixel each; red is the low byte
  const flags = new Uint8Array(next)
  renderer.setRenderTarget(target)
  for (const [index, [bearing, elevation]] of directions.entries()) {
    // Let the page breathe now and then, so the build can follow along.
    if (index % 25 === 0) { window.progress = index / directions.length; await new Promise(resolve => setTimeout(resolve)) }
    const b = THREE.MathUtils.degToRad(bearing), e = THREE.MathUtils.degToRad(elevation)
    const direction = new THREE.Vector3(Math.sin(b) * Math.cos(e), Math.sin(e), Math.cos(b) * Math.cos(e))
    camera.position.copy(sphere.center).addScaledVector(direction, r * 2)
    camera.up.set(0, elevation === 90 ? 0 : 1, elevation === 90 ? -1 : 0)
    camera.lookAt(sphere.center)
    renderer.render(scene, camera)
    renderer.readRenderTargetPixels(target, 0, 0, SIZE, SIZE, pixels)
    for (let i = 0; i < words.length; i++) {
      const id = words[i] & 0xffffff
      if (id) flags[id] = 1
    }
  }

  let text = ''
  for (let i = 0; i < flags.length; i += 0x8000) text += String.fromCharCode(...flags.subarray(i, i + 0x8000))
  window.result = { parts, flags: btoa(text), views: directions.length }
} catch (error) {
  window.failure = String(error?.stack ?? error)
}
</script>
</body>
</html>
